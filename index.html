<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080808">
  <meta name="referrer" content="origin">
  <title>日本旅行路線提醒器 v11.2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=11.2.1">
</head>
<body>
<div id="desktopShell">
  <aside id="simPanel" aria-label="桌面模擬控制台">
    <h2>iPhone 模擬控制台</h2>
    <p>只在桌面顯示，不會出現在手機版。</p>
    <label>模擬 GPS
      <select id="simGpsQuality">
        <option value="good">良好</option><option value="fair">普通</option><option value="bad">不佳</option><option value="stale">過舊</option><option value="off">停止</option>
      </select>
    </label>
    <div class="sim-grid">
      <button data-sim="start">路線起點</button><button data-sim="advance">沿路前進</button>
      <button data-sim="left">往左偏離</button><button data-sim="right">往右偏離</button>
      <button data-sim="return">返回路線</button><button data-sim="near">接近下一站</button>
    </div>
    <label>模擬時間偏差
      <select id="simDelay"><option value="0">準時</option><option value="5">落後 5 分鐘</option><option value="15">落後 15 分鐘</option><option value="30">落後 30 分鐘</option></select>
    </label>
    <button id="exitSimBtn" class="secondary">恢復真實 GPS</button>
  </aside>

  <div id="phoneFrame">
    <main id="app">
      <header class="topbar">
        <div class="trip-heading">
          <strong id="tripName">尚未載入行程</strong>
          <span id="tripSlack">時間餘裕：尚無資料</span>
        </div>
        <div class="indicators">
          <button id="gpsIndicator" class="indicator idle" aria-label="GPS 詳細資料"><i></i>GPS</button>
          <button id="wakeIndicator" class="indicator idle" aria-label="Wake Lock 狀態"><i></i>螢幕</button>
          <button id="voiceIndicator" class="indicator ok" aria-label="語音狀態"><i></i>語音</button>
        </div>
      </header>

      <section id="mapWrap">
        <div id="map"></div>
        <button id="recenterBtn" class="map-fab" title="回到目前位置">◎</button>
        <div id="mapMessage" class="map-message hidden"></div>
        <div id="pickBanner" class="pick-banner hidden">點地圖選擇景點位置 <button id="cancelPickBtn">取消</button></div>
      </section>

      <section id="tripSummary">
        <div id="nextStopCard">
          <small>下一站・長按可暫停／繼續</small>
          <strong id="nextStopName">尚未設定</strong>
          <span id="nextStopDistance">—</span>
        </div>
        <div class="time-summary">
          <small>預估抵達</small>
          <strong id="etaText">—</strong>
          <span id="delayText">尚無時間資料</span>
        </div>
      </section>

      <nav class="bottom-actions">
        <button id="tripCalcBtn"><b>⏱</b><span>行程時間評估</span></button>
        <button id="arriveBtn" class="primary"><b>✓</b><span>我已抵達</span></button>
        <button id="quickAddBtn"><b>＋</b><span>臨時景點</span></button>
        <button id="moreBtn"><b>•••</b><span>更多</span></button>
      </nav>
    </main>
  </div>
</div>

<div id="drawerBackdrop" class="hidden"></div>
<section id="drawer" class="drawer hidden" aria-modal="true">
  <header><div class="drawer-title-row"><h2 id="drawerTitle">功能</h2><button id="drawerHelp" class="hidden" aria-label="說明">？</button></div><button id="drawerClose">✕</button></header>
  <div id="drawerBody"></div>
</section>

<div id="blackScreen" class="hidden">
  <div class="black-info"><div id="blackStop">下一站：—</div><div id="blackStatus">定位中</div><div id="blackWake">Wake Lock：—</div><p>長按 3 秒離開</p><div id="holdRing"></div></div>
</div>

<template id="moreTemplate">
  <div class="more-groups">
    <section class="menu-group"><h3>行程操作</h3><div class="menu-grid">
      <button data-menu="trip">更換／匯入行程</button><button data-menu="stops">行程與景點清單</button>
    </div></section>
    <section class="menu-group"><h3>導航與顯示</h3><div class="menu-grid">
      <button data-menu="gps">GPS 詳細資料</button><button data-menu="black">黑畫面省電</button>
      <button data-menu="settings">偏離與語音設定</button>
    </div></section>
    <section class="menu-group"><h3>資料與系統</h3><div class="menu-grid">
      <button data-menu="backup">備份與恢復</button><button data-menu="about">路線提醒器資訊</button>
      <button data-menu="end" class="danger">結束／取消行程</button>
    </div></section>
  </div>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script src="app.js?v=11.2.1"></script>
</body>
</html>
