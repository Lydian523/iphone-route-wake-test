<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>路線偏離測試器</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section class="panel top-panel">
      <h1>路線偏離測試器</h1>
      <p class="hint">iPhone 11 Pro 實測用：GPX 匯入、Wake Lock、GPS 距離路線、黑畫面口袋模式。</p>

      <div class="row">
        <label class="file-btn">
          匯入 GPX
          <input id="gpxInput" type="file" accept=".gpx,application/gpx+xml,text/xml" />
        </label>
        <button id="startBtn">開始定位</button>
        <button id="stopBtn" disabled>停止</button>
      </div>

      <div class="row">
        <button id="wakeBtn">啟用 Wake Lock</button>
        <button id="blackBtn">黑畫面省電模式</button>
      </div>

      <div class="row compact">
        <label>提醒聲
          <select id="soundMode">
            <option value="beep">嗶聲</option>
            <option value="voice">語音</option>
            <option value="both" selected>嗶聲 + 語音</option>
          </select>
        </label>
        <button id="testSoundBtn">測試聲音</button>
      </div>
    </section>

    <section class="panel grid">
      <div class="card"><span>GPS 精度</span><strong id="accuracy">—</strong></div>
      <div class="card"><span>距離路線</span><strong id="distance">—</strong></div>
      <div class="card"><span>狀態</span><strong id="status">未開始</strong></div>
      <div class="card"><span>Wake Lock</span><strong id="wakeStatus">未啟用</strong></div>
      <div class="card"><span>GPX 點數</span><strong id="pointCount">0</strong></div>
      <div class="card"><span>已定位</span><strong id="fixCount">0</strong></div>
    </section>

    <section class="panel">
      <canvas id="routeCanvas" width="800" height="480" aria-label="路線簡圖"></canvas>
      <p class="hint">灰線是 GPX 路線，白點是目前位置。這不是正式地圖，只是測試 GPS 與路線距離。</p>
    </section>

    <section class="panel">
      <h2>測試門檻</h2>
      <div class="thresholds">
        <label>注意距離 <input id="warnM" type="number" value="30" min="1" /> 公尺</label>
        <label>偏離距離 <input id="offM" type="number" value="50" min="1" /> 公尺</label>
        <label>嚴重偏離 <input id="badM" type="number" value="80" min="1" /> 公尺</label>
      </div>
      <p class="hint">2 公尺只適合觀察 GPS 飄移，不建議當正式提醒門檻。</p>
    </section>

    <section class="panel">
      <h2>紀錄</h2>
      <pre id="log"></pre>
      <div class="row">
        <button id="copyLogBtn">複製紀錄</button>
        <button id="clearLogBtn">清除紀錄</button>
      </div>
    </section>
  </main>

  <div id="blackScreen" class="hidden" role="button" aria-label="黑畫面省電模式">
    <div class="black-info">
      <div id="blackStatus">定位中</div>
      <div id="blackDistance">距離路線：—</div>
      <div class="unlock-note">長按 3 秒離開黑畫面</div>
      <div id="holdRing"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
